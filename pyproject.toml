[project]
name = "shrinkwrap"
version = "0.1.0"
description = "PCB shrink-wrap height envelope generator"
requires-python = ">=3.14,<3.15"

dependencies = [
    "numpy>=2.0",
    "pyside6>=6.8",
    "pyopengl>=3.1.7",
    "pyopengl-accelerate>=3.1.10",
    "trimesh>=4.4",
    "scipy>=1.18.0",
    "pyobjc-framework-cocoa>=12.2.2",
    "pybind11>=3.1.0",
    "psutil>=7.2.2",
]

[project.scripts]
shrinkwrap = "shrinkwrap.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shrinkwrap"]

[tool.uv]
package = true
